# Server
server.port=${PORT:8080}

# DB config (local default: H2, production: set SPRING_DATASOURCE_* env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/lostandfound}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

logging.level.hyk.springframework.lostandfoundsystem=debug
logging.level.org.springframework.web=DEBUG

# show sql
#spring.jpa.properties.hibernate.show_sql=true
# pretty format SQL
#spring.jpa.properties.hibernate.format_sql=true
# show bind parameters
#logging.level.org.hibernate.type.descriptor.sql=trace


server.error.include-binding-errors=always

spring.mvc.format.date=yyyy-MM-dd

# Email configuration for OTP (set env vars in Railway)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# OTP Configuration
otp.expiration.minutes=5
otp.length=6
otp.resend.timeout.seconds=60
otp.email.provider=${OTP_EMAIL_PROVIDER:smtp}

# Resend API configuration (used when OTP_EMAIL_PROVIDER=resend)
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:}

# Gmail Apps Script webhook configuration (used when OTP_EMAIL_PROVIDER=gmail_script)
gmail.script.url=${GMAIL_SCRIPT_URL:}
gmail.script.secret=${GMAIL_SCRIPT_SECRET:}

# ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:5000}
matching.threshold=0.6

# Upload storage (Railway writable volume path recommended: /data/uploads)
app.upload.dir=${UPLOAD_DIR:./uploads}
